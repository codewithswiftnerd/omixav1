[pytest]
; Puts the project root on sys.path so test modules can `import
; config`, `from utils.file_handler import ...`, etc. without needing
; __init__.py files anywhere — pytest's default "rootless" import
; mode otherwise only adds each test file's own directory (testing/,
; tests/), not the project root, which is why `pytest` didn't run
; cleanly before this file existed.
pythonpath = .
testpaths = testing tests
filterwarnings =
    ignore::DeprecationWarning
